name: Manual Enterprise Plan Tests (PRE environment)
#
# Runs the Enterprise Plan suite (tests/enterprise/, --project=enterprise —
# see tests/enterprise/README.md). Manual-only for now: the suite still has
# unimplemented stubs.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests_enterprise:
    defaults:
      run:
        shell: bash
    environment: PRE
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Playwright Environment
        uses: ./.github/actions/setup-playwright

      - name: Run Enterprise Playwright tests
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PWD: ${{ secrets.LOGIN_PWD }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GMAIL_NAME: ${{ secrets.GMAIL_NAME }}
          GMAIL_DOMAIN: ${{ secrets.GMAIL_DOMAIN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_MODE: ${{ vars.QASE_MODE }}
          QASE_PROJECT_CODE: ${{ secrets.QASE_PROJECT_CODE }}
          STRIPE_SK: ${{ secrets.STRIPE_SK }}
        run: |
          # --workers left unset (config default) — GitHub runners need
          # their own calibration before raising it, unlike local dev.
          echo "🌐 Running the full Enterprise project (implemented cases + skipped stubs)..."
          npx playwright test --project=enterprise 2>&1 | tee test-output.log

      - name: Add Qase run link to summary
        if: always()
        run: |
          QASE_LINK=$(grep -oP 'https://app\.qase\.io/run/[A-Z0-9]+/dashboard/\d+' test-output.log | head -1)
          if [ -n "$QASE_LINK" ]; then
            echo "## Qase Report" >> $GITHUB_STEP_SUMMARY
            echo "🔗 [View run in Qase]($QASE_LINK)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate and Upload Reports
        uses: ./.github/actions/upload-reports
        with:
          artifact-name: 'playwright-report-enterprise'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          browser-name: 'Enterprise'
          is-manual-execution: 'true'
          testdino_api_key: ${{ secrets.TDPW_API_KEY }}
        if: always()

      - name: Send Mattermost Notification
        uses: ./.github/actions/send-notification
        with:
          mattermost-webhook-url: ${{ secrets.MATTERMOST_WEBHOOK_PR }}
          browser-name: 'Enterprise'
          folder-path: 'tests/enterprise'
          is-manual-execution: 'true'
          username: ${{ github.actor }}
        if: always()
