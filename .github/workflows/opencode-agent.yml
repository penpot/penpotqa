name: OpenCode Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  opencode:
    if: >
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Free model names change often, so pick the newest free model of the
      # requested family (`--model <family>` in the comment, deepseek by default).
      - name: Resolve latest free model
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          family=$(grep -oP -- '--model\s+\K[a-z0-9.-]+' <<< "$COMMENT_BODY" | head -1)
          family=${family:-deepseek}
          free=$(npx -y opencode-ai models opencode --refresh | grep -E '^opencode/.*-free$')
          model=$(grep -E "^opencode/${family}" <<< "$free" | sort -V | tail -1)
          model=${model:-$(head -1 <<< "$free")}
          echo "Using model: $model"
          echo "name=$model" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ steps.model.outputs.name }}
          use_github_token: true
