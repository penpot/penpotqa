name: OpenCode Agent

# Reviews a PR against the team skills in .claude/skills/ and posts the findings
# as inline review comments. Trigger it with a PR comment that starts with
# `/oc review-qa-pr`, or manually from the Actions tab with the PR number.
# The prompt is fixed in .github/opencode/review-prompt.md.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the PR to review
        required: true
        type: number

permissions: {}

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["estefafdez","lugarbos","tdelatorre","daniel-herrero"]'),
         github.actor)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJSON('["estefafdez","lugarbos","tdelatorre","daniel-herrero"]'),
         github.event.comment.user.login) &&
       startsWith(github.event.comment.body, '/oc review-qa-pr'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opencode-review-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || inputs.pr }}
      MODEL: opencode-go/${{ vars.OPENCODE_MODEL || 'deepseek-v4.1-flash' }}
      EFFORT: ${{ vars.OPENCODE_EFFORT || 'high' }}
      OPENCODE_CONFIG: .github/opencode/review.json
      OPENCODE_DISABLE_AUTOUPDATE: 'true'
      OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
    steps:
      # Skills and prompt come from the branch the workflow runs on
      # (the default branch for comments). The PR code is never checked out:
      # the review reads its diff only.
      - name: Check out the workflow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Acknowledge the request
        if: github.event_name == 'issue_comment'
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=eyes --silent

      # Same pinned V1 CLI as penpot/penpot: the opencode-go provider and
      # `opencode run --pure` are known to work there.
      - name: Install OpenCode
        run: |
          REVIEW_DIR="$RUNNER_TEMP/review"
          echo "REVIEW_DIR=$REVIEW_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REVIEW_DIR/bin"
          curl -fsSL --retry 3 -o "$REVIEW_DIR/cli.tgz" \
            https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.19.5.tgz
          sha=8b5aa1ed5a282c630bf715fab9df77cb4240f23ff568f7836112a3b26617ac95f54e32161e004132411b1093d9b61a566ec260fff5df06047a29befe34f68989
          printf '%s  %s\n' "$sha" "$REVIEW_DIR/cli.tgz" | sha512sum --check
          tar -xzf "$REVIEW_DIR/cli.tgz" -C "$REVIEW_DIR/bin" --strip-components=2 package/bin/opencode
          echo "$REVIEW_DIR/bin" >> "$GITHUB_PATH"

      # The prompt lists each skill's name and description, so the model opens
      # only the skills the diff touches, and carries the diff inline without
      # the removed lines (only added lines are reviewed). Over 150 KB, the PR
      # is not reviewed: the model takes too long and may not answer.
      - name: Build the review prompt
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid \
            > "$REVIEW_DIR/head"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" | grep -v '^-[^-]' > "$REVIEW_DIR/change.diff"
          size=$(( $(wc -c < "$REVIEW_DIR/change.diff") / 1000 ))
          if (( size > 150 )); then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              "OpenCode review skipped: the diff is too large (${size} KB without removed lines, limit 150 KB)."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            cat .github/opencode/review-prompt.md
            echo
            echo '## Team skills'
            echo
            for skill in .claude/skills/*/SKILL.md; do
              description=$(sed -n 's/^description: *//p' "$skill" | head -1)
              echo "- \`$skill\`: $description"
            done
            echo
            echo '## Diff'
            echo
            cat "$REVIEW_DIR/change.diff"
          } > "$REVIEW_DIR/prompt"

      - name: Review with OpenCode
        if: env.SKIP != 'true'
        timeout-minutes: 15
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          opencode run --pure --model "$MODEL" --variant "$EFFORT" --format json < "$REVIEW_DIR/prompt" \
            > "$REVIEW_DIR/events"
          # With no answer, print the start of each event to see why (tools, errors).
          jq -ers '[.[] | select(.type == "text") | .part.text] | last // error("OpenCode returned no text")' \
            "$REVIEW_DIR/events" > "$REVIEW_DIR/answer" ||
            { echo "OpenCode events:"; cut -c1-400 "$REVIEW_DIR/events"; exit 1; }

      # Same as penpot/penpot: the answer is the review, the workflow only adds
      # the header and publishes it.
      - name: Post the review
        if: env.SKIP != 'true'
        run: |
          head=$(cat "$REVIEW_DIR/head")
          # Tokens of every model step (input, output, reasoning and cache).
          tokens=$(jq -rs '[.[] | select(.type == "step_finish") | .part.tokens
            | (.input // 0) + (.output // 0) + (.reasoning // 0) + (.cache.read // 0) + (.cache.write // 0)]
            | add // 0 | "\(. / 1000 | round)k tokens"' "$REVIEW_DIR/events")
          # Some models wrap the JSON answer in a Markdown code fence.
          sed '/^\s*```\(json\)\?\s*$/d' "$REVIEW_DIR/answer" |
            jq -e --arg header "**OpenCode review against the team skills** · \`$MODEL\` ($EFFORT) · \`${head:0:7}\` · $tokens" --arg sha "$head" '
              {commit_id: $sha, event: "COMMENT", body: ($header + "\n\n" + .summary),
                comments: [.comments[] | {path, line, side, body}]}' |
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --input - --jq .html_url

      - name: Report a failed review
        if: failure()
        run: >-
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body
          "OpenCode review failed. See the [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
