# Throwaway, one-off: deletes the two test release stories (#2569, #2570)
# created while manually testing release-triage.yml. Removed right after use.
name: _tmp cleanup test stories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: PRE
    steps:
      - name: Delete test stories 2569 and 2570
        env:
          TAIGA_URL: ${{ secrets.TAIGA_URL }}
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
          TAIGA_PROJECT: ${{ vars.TAIGA_PROJECT }}
        run: |
          TOKEN=$(curl -sf -X POST "$TAIGA_URL/api/v1/auth" \
            -H 'Content-Type: application/json' \
            -d "{\"type\":\"normal\",\"username\":\"$TAIGA_USERNAME\",\"password\":\"$TAIGA_PASSWORD\"}" \
            | jq -r '.auth_token')
          PROJECT_ID=$(curl -sf -H "Authorization: Bearer $TOKEN" -H 'User-Agent: qa-triage/1.0' \
            "$TAIGA_URL/api/v1/projects/by_slug?slug=$TAIGA_PROJECT" | jq -r '.id')
          for REF in 2569 2570; do
            STORY_ID=$(curl -sf -H "Authorization: Bearer $TOKEN" -H 'User-Agent: qa-triage/1.0' \
              "$TAIGA_URL/api/v1/userstories/by_ref?ref=$REF&project=$PROJECT_ID" | jq -r '.id')
            if [ -n "$STORY_ID" ] && [ "$STORY_ID" != "null" ]; then
              curl -sf -X DELETE "$TAIGA_URL/api/v1/userstories/$STORY_ID" \
                -H "Authorization: Bearer $TOKEN" -H 'User-Agent: qa-triage/1.0' \
                && echo "Deleted story #$REF (id $STORY_ID)" \
                || echo "Failed to delete #$REF"
            else
              echo "Could not resolve story #$REF"
            fi
          done
