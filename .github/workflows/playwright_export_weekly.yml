name: Weekly WebGL Export Tests on PRE
#
# Runs the WebGL export suite (tests/panels-features/export/, --project=export).
# It is kept out of the daily `chrome` run; change the cron below to run it
# more or less often.

on:
  schedule: ## run tests at 20:50 UTC (22:50 UTC+2) on Friday, when there is no daily run
    - cron: '50 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests_export:
    defaults:
      run:
        shell: bash
    environment: PRE
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Playwright Environment
        uses: ./.github/actions/setup-playwright

      - name: Run Export Playwright tests
        id: run-tests
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_MODE: ${{ vars.QASE_MODE }}
          QASE_PROJECT_CODE: ${{ secrets.QASE_PROJECT_CODE }}
          BASE_URL: ${{ secrets.BASE_URL }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PWD: ${{ secrets.LOGIN_PWD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: npx playwright test --project=export 2>&1 | tee test-output.log

      - name: Add Qase run link to summary
        id: run-links
        if: always()
        run: |
          QASE_LINK=$(grep -oP 'https://app\.qase\.io/run/[A-Z0-9]+/dashboard/\d+' test-output.log | head -1 || true)
          if [ -n "$QASE_LINK" ]; then
            echo "## Qase Report" >> $GITHUB_STEP_SUMMARY
            echo "🔗 [View run in Qase]($QASE_LINK)" >> $GITHUB_STEP_SUMMARY
          fi

          TESTDINO_URL=$(grep -oP 'https://app\.testdino\.com/\S+/test-runs/\S+' test-output.log | head -1)
          echo "testdino-url=$TESTDINO_URL" >> $GITHUB_OUTPUT

      - name: Generate and Upload Reports
        uses: ./.github/actions/upload-reports
        with:
          artifact-name: 'playwright-report-export'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          browser-name: 'Chrome'
          report-suffix: 'export'
        if: always()

      - name: Send Mattermost Notification
        uses: ./.github/actions/send-notification
        with:
          mattermost-webhook-url: ${{ secrets.MATTERMOST_WEBHOOK_DAILY_REPORT }}
          browser-name: 'Chrome'
          folder-path: 'tests/panels-features/export'
          report-suffix: 'export'
          testdino-url: ${{ steps.run-links.outputs.testdino-url }}
        if: always()
        continue-on-error: true
