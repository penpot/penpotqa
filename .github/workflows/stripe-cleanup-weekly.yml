# .github/workflows/stripe-cleanup-weekly.yml
#
# Deletes Stripe sandbox test customers created by Playwright runs
# (scripts/cleanup-stripe-test-customers.ts). Runs every Friday at 18:00 Europe/Madrid.
# Note: cron is always evaluated in UTC and GitHub doesn't shift it for DST,
# so this fires at 17:00 local time during CET (winter) instead of 18:00.

name: Stripe test customers cleanup

on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: PRE # grants access to the STRIPE_CLEANUP_SK secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run cleanup
        env:
          STRIPE_CLEANUP_SK: ${{ secrets.STRIPE_CLEANUP_SK }}
        run: npx tsx scripts/cleanup-stripe-test-customers.ts --execute --yes 2>&1 | tee cleanup-output.log

      - name: Notify Mattermost
        if: always()
        continue-on-error: true
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_DAILY_REPORT }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            DELETED=$(grep -oP '^Deleted: \K\d+' cleanup-output.log || echo '?')
            FAILED=$(grep -oP '^Failed: \K\d+' cleanup-output.log || echo '0')
            TEXT="**Stripe test customers cleanup** — deleted $DELETED, failed $FAILED"
          else
            TEXT="**:warning: Stripe test customers cleanup failed** — [check the run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text "$TEXT" '{username:"Stripe cleanup", icon_emoji:":broom:", text:$text}')" \
            "$MATTERMOST_WEBHOOK_URL"
