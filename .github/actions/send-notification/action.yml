name: 'Send Mattermost Notification'
description: 'Send test results notification to Mattermost'

inputs:
  mattermost-webhook-url:
    description: 'Mattermost webhook URL'
    required: true
  browser-name:
    description: 'Browser name for the notification'
    required: true
  folder-path:
    description: 'Test folder path (optional)'
    required: false
  repeat-each:
    description: 'Run each test N times.'
    required: false
  is-manual-execution:
    description: 'Whether this is a manual execution (true/false)'
    required: false
    default: 'false'
  username:
    description: 'Username for manual execution mention'
    required: false
  report-suffix:
    description: 'Must match upload-reports report-suffix, so the report link points at the right S3 folder'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Generate Mattermost message content
      id: message
      shell: bash
      run: |
        FOLDER_PATH="${{ inputs.folder-path }}"
        IS_MANUAL="${{ inputs.is-manual-execution }}"
        USERNAME="${{ inputs.username }}"
        REPEAT_EACH="${{ inputs.repeat-each }}"
        BROWSER_NAME="${{ inputs.browser-name }}"
        REPORT_SUFFIX="${{ inputs.report-suffix }}"

        # Generate the message content and save to output
        if [ -n "$FOLDER_PATH" ]; then
          if [ "$IS_MANUAL" = "true" ] && [ -n "$USERNAME" ]; then
            MESSAGE=$(npx ts-node -e "require('./helpers/mattermost.helper.js').generateMessage('$FOLDER_PATH', '$REPEAT_EACH', true, '$USERNAME', '$BROWSER_NAME', '$REPORT_SUFFIX')")
          else
            MESSAGE=$(npx ts-node -e "require('./helpers/mattermost.helper.js').generateMessage('$FOLDER_PATH', null, false, null, '$BROWSER_NAME', '$REPORT_SUFFIX')")
          fi
        else
          if [ "$IS_MANUAL" = "true" ] && [ -n "$USERNAME" ]; then
            MESSAGE=$(npx ts-node -e "require('./helpers/mattermost.helper.js').generateMessage(null, '$REPEAT_EACH', true, '$USERNAME', '$BROWSER_NAME', '$REPORT_SUFFIX')")
          else
            MESSAGE=$(npx ts-node -e "require('./helpers/mattermost.helper.js').generateMessage(null, null, false, null, '$BROWSER_NAME', '$REPORT_SUFFIX')")
          fi
        fi

        # Save message to output, handling multiline content
        echo "message<<EOF" >> $GITHUB_OUTPUT
        echo "$MESSAGE" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Send Mattermost notification
      if: always()
      uses: mattermost/action-mattermost-notify@v2.1.0
      with:
        MATTERMOST_WEBHOOK_URL: ${{ inputs.mattermost-webhook-url }}
        TEXT: ${{ steps.message.outputs.message }}
