name: 'Run Penpot QA suite'
description: >-
  Runs the penpotqa Playwright suite (chrome project) against any Penpot
  instance, e.g. a temporary environment started from a dev branch. Tests
  tagged @external (Gmail, SSO) are always skipped.
author: 'Penpot QA Team'

# Usage from another repository (e.g. penpot/penpot), in the same job that
# starts the Penpot environment, so `localhost` URLs work:
#
#   - uses: penpot/penpotqa/.github/actions/run-penpotqa@main
#     with:
#       base-url: http://localhost:9001
#       tests: tests/tokens tests/components/variants   # empty = all
#       grep: '2204|2205'                                # optional
#
# GitHub downloads the whole penpotqa repository at the ref used in `uses:`
# (@main, a branch, a tag or a sha), so the tests always come from that same
# ref. No separate checkout is needed.

inputs:
  base-url:
    description: 'Penpot URL to test, e.g. http://localhost:9001'
    required: true
  # No account inputs: tests create their own demo accounts through the API,
  # so the instance only needs the `enable-demo-users` flag.
  tests:
    description: >-
      Space-separated spec files and/or folders to run, relative to the
      penpotqa root (e.g. "tests/tokens tests/login-signup/login.spec.ts").
      Empty runs the whole chrome project.
    required: false
    default: ''
  grep:
    description: 'Only run tests whose title matches this regex (optional), e.g. "2204|2205"'
    required: false
    default: ''
  repeat-each:
    description: 'Run each test N times'
    required: false
    default: '1'
  workers:
    description: 'Playwright workers (empty = config default)'
    required: false
    default: ''
  artifact-name:
    description: 'Name of the uploaded Playwright report artifact'
    required: false
    default: 'penpotqa-report'

outputs:
  passed:
    description: 'Number of tests that passed (flaky included)'
    value: ${{ steps.summary.outputs.passed }}
  failed:
    description: 'Number of tests that failed'
    value: ${{ steps.summary.outputs.failed }}

runs:
  using: 'composite'
  steps:
    - name: Locate penpotqa
      id: root
      shell: bash
      run: echo "dir=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: ${{ steps.root.outputs.dir }}/.nvmrc

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      run: npm ci

    - name: Get installed Playwright version
      id: playwright-version
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      run: echo "version=$(npx playwright --version | cut -d ' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      env:
        CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = "true" ]; then
          npx playwright install-deps chrome
        else
          npx playwright install --with-deps chrome
        fi

    - name: Check Penpot is reachable
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: |
        for i in $(seq 1 30); do
          if curl -fsS -o /dev/null "${BASE_URL%/}/"; then
            echo "✅ Penpot is up at $BASE_URL"
            exit 0
          fi
          echo "⏳ Waiting for $BASE_URL ($i/30)..."
          sleep 10
        done
        echo "❌ Penpot did not answer at $BASE_URL"
        exit 1

    - name: Run Playwright tests
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      # Inputs are passed through env, never interpolated into the script,
      # so free-text values (paths, grep) can't inject shell commands.
      env:
        BASE_URL: ${{ inputs.base-url }}
        # Only typed into forms by a few tests (e.g. sign-up negative cases);
        # the tests that register real accounts with it are @external.
        LOGIN_PWD: 'Penpotqa-temp-1234'
        TESTS: ${{ inputs.tests }}
        GREP: ${{ inputs.grep }}
        REPEAT_EACH: ${{ inputs.repeat-each }}
        WORKERS: ${{ inputs.workers }}
        QASE_MODE: 'off'
      run: |
        ARGS=(--project=chrome --grep-invert @external --repeat-each="$REPEAT_EACH")
        [ -n "$GREP" ] && ARGS+=(-g "$GREP")
        [ -n "$WORKERS" ] && ARGS+=(--workers="$WORKERS")

        read -ra PATHS <<< "$TESTS"
        for p in "${PATHS[@]}"; do
          case "$p" in
            tests/enterprise*)
              echo "❌ '$p': the Enterprise suite needs licenses/SSO/Stripe and can't run here"
              exit 1
              ;;
          esac
          if [ ! -e "$p" ]; then
            echo "❌ '$p' does not exist in penpotqa"
            exit 1
          fi
          ARGS+=("$p")
        done

        echo "🌐 $BASE_URL"
        echo "📋 npx playwright test ${ARGS[*]}"
        npx playwright test "${ARGS[@]}"

    - name: Write summary
      id: summary
      if: always()
      shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      env:
        BASE_URL: ${{ inputs.base-url }}
        TESTS: ${{ inputs.tests }}
        GREP: ${{ inputs.grep }}
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        RESULTS=playwright-report/results.json
        if [ ! -f "$RESULTS" ]; then
          echo "### ⚠️ Penpot QA: no results (the run did not start)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        read -r PASSED FAILED FLAKY SKIPPED < <(node -e '
          const s = require(process.argv[1]).stats;
          console.log(s.expected + s.flaky, s.unexpected, s.flaky, s.skipped);
        ' "$PWD/$RESULTS")
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
        echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
        {
          [ "$FAILED" = "0" ] && echo "### ✅ Penpot QA suite" || echo "### ❌ Penpot QA suite"
          echo ""
          echo "| Passed | Failed | Flaky | Skipped |"
          echo "|---|---|---|---|"
          echo "| $PASSED | $FAILED | $FLAKY | $SKIPPED |"
          echo ""
          echo "- Penpot: \`$BASE_URL\`"
          echo "- Tests: \`${TESTS:-all}\`${GREP:+ · grep \`$GREP\`}"
          echo "- Tests tagged \`@external\` (Gmail, SSO) were skipped."
          echo "- Download the **$ARTIFACT** artifact and open \`index.html\` for traces, videos and screenshots."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.root.outputs.dir }}/playwright-report/
        retention-days: 14
        if-no-files-found: ignore
